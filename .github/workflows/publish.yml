name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做 dry-run，不真正发布'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance（--provenance 需要 OIDC）

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
            echo "npm auth: token"
          else
            echo "npm auth: OIDC trusted publishing（未配置 NPM_TOKEN）"
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 版本 v$VERSION 不一致"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "::error::只发布正式版本，package.json 版本不能包含预发布后缀：$VERSION"
            exit 1
          fi
          TAG=latest
          echo "version=$VERSION dist-tag=$TAG"

          if npm view "dsh-plugin-link-resolver@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::dsh-plugin-link-resolver@$VERSION 已存在于 npm，跳过发布"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --tag "$TAG" --access public --dry-run
          else
            npm publish --tag "$TAG" --access public --provenance
          fi
